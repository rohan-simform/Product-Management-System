<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Product Management System</span>
            <div class="d-flex" id="searchForm">
                <input class="form-control me-2" type="search" placeholder="Search" id="searchBar" aria-label="Search" />
                <button class="btn btn-sm btn-primary rounded-3" type="button" id="searchBtn">Search</button>
            </div>
            <form class="d-flex">
                <select class="form-select" id="sortProduct" aria-label="Default select example">
                    <option value="id" selected>Sort By : Product ID</option>
                    <option value="name">Product Name</option>
                    <option value="price">Product Price</option>
                </select>
            </form>
            <button class="btn btn-primary rounded-3" id="addBtn" data-bs-toggle="modal" data-bs-target="#productModal">Add New Product</button>
        </div>
    </nav>
    
    <div class="container py-4">
        <div class="card shadow-sm rounded-4">
            <div class="card-body">
                <table class="table table-hover align-middle text-center">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Image</th>
                            <th>Name</th>
                            <th>Price</th>
                            <th>Description</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="t-body" class="table-group-divider"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="modalTitle">Add New Product</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="container">
                        <form id="productForm">
                            <input type="hidden" id="formMode" value="add">
                            <div class="mb-3 row">
                                <label for="productId" class="col-sm-2 col-form-label">Product Id:</label>
                                <div class="col-sm-10">
                                    <input type="number" class="form-control" id="productId" min="1" required>
                                </div>
                            </div>
                            <div class="mb-3 row">
                                <label for="productName" class="col-sm-2 col-form-label">Product Name:</label>
                                <div class="col-sm-10">
                                    <input type="text" class="form-control" id="productName" maxlength="50" required>
                                </div>
                            </div>
                            <div class="mb-3 row">
                                <label for="productImage" class="col-sm-2 col-form-label">Product Image:</label>
                                <div class="col-sm-10">
                                    <input class="form-control" type="file" id="productImage" accept="image/*" required>
                                </div>
                            </div>
                            <div class="mb-3 row">
                                <label for="productPrice" class="col-sm-2 col-form-label">Product Price:</label>
                                <div class="col-sm-10">
                                    <input type="number" class="form-control" id="productPrice" required>
                                </div>
                            </div>
                            <div class="mb-3 row">
                                <label for="productDescription" class="col-sm-2 col-form-label">Product
                                    Description:</label>
                                <div class="col-sm-10">
                                    <textarea class="form-control" rows="4" id="productDescription" name="text" maxlength="500" 
                                    required></textarea>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary" form="productForm">Save changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
